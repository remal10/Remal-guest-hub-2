            <label id="lblRoomInput" class="block text-xs font-bold text-stone-700">Room or Villa Number:</label>

        </div>

        <!-- Filtres par Catégorie -->

            <!-- Généré dynamiquement -->
        </div>

        ];

        let cart = {};
        let currentRoom = '';
        let currentLang = 'en';
        let currentCategory = 'All';

        function initApp() {
            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');
            
            if (roomParam) {
                currentRoom = roomParam;
                document.getElementById('input-room').value = currentRoom;
                document.getElementById('lbl-room').innerText = currentRoom;
                localStorage.setItem('remal_room_simple', currentRoom);
            } else {
                currentRoom = localStorage.getItem('remal_room_simple') || '';
                if (currentRoom) {
                    document.getElementById('input-room').value = currentRoom;
                    document.getElementById('lbl-room').innerText = currentRoom;
                }
            }
            setLang('en');
        }

        function saveRoom(room) {
            currentRoom = room.trim();
            localStorage.setItem('remal_room_simple', currentRoom);
            document.getElementById('lbl-room').innerText = currentRoom || '...';
        }

        function setLang(lang) {
            currentLang = lang;
            const t = i18n[lang];

            document.getElementById('htmlRoot').setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');

            ['en', 'ar', 'hi'].forEach(l => {
                const btn = document.getElementById(`btn-${l}`);
                if (l === lang) {
                    btn.className = "px-2.5 py-1 rounded-full bg-stone-900 text-white shadow-xs";
                } else {
                    btn.className = "px-2.5 py-1 rounded-full text-stone-600";
                }
            });

            document.getElementById('lblRoomTitle').innerText = t.roomTitle;
            document.getElementById('heroTitle').innerText = t.heroTitle;
            document.getElementById('heroSub').innerText = t.heroSub;
            document.getElementById('lblRoomInput').innerText = t.lblRoomInput;
            document.getElementById('input-room').placeholder = t.placeholderRoom;
            document.getElementById('lblItemsText').innerText = t.itemsText;
            document.getElementById('lblWhatsappBtn').innerText = t.whatsappBtn;
            document.getElementById('current-category-title').innerText = currentCategory === 'All' ? t.allDishes : (t.categories[currentCategory] || currentCategory);

            renderCategories();
            renderMenu();
        }

        function renderCategories() {
            const t = i18n[currentLang];
            const categories = ['All', ...new Set(menuItems.map(i => i.category))];
            const container = document.getElementById('category-filters');
            
            container.innerHTML = categories.map(cat => {
                const displayName = cat === 'All' ? t.catAll : (t.categories[cat] || cat);
                return `
                    <button onclick="filterCategory('${cat}')" class="px-4 py-2 rounded-full whitespace-nowrap text-xs font-semibold ${currentCategory === cat ? 'bg-stone-900 text-white' : 'bg-white text-stone-600 border border-stone-200'}">${displayName}</button>
                `;
            }).join('');
        }

        function filterCategory(cat) {
            currentCategory = cat;
            const t = i18n[currentLang];
            document.getElementById('current-category-title').innerText = cat === 'All' ? t.allDishes : (t.categories[cat] || cat);
            renderMenu();
            renderCategories();
        }

        function renderMenu() {
            const container = document.getElementById('menu-list');
            const filtered = currentCategory === 'All' ? menuItems : menuItems.filter(i => i.category === currentCategory);

            container.innerHTML = filtered.map(item => {
                const nameText = item.name[currentLang] || item.name.en;
                const descText = item.desc[currentLang] || item.desc.en;

                return `
                    <div class="bg-white p-4 rounded-2xl border border-stone-200 shadow-xs flex justify-between items-center">
                        <div class="pr-2">
                            <h4 class="font-bold text-stone-900 text-sm">${nameText}</h4>
                            <p class="text-[11px] text-stone-500">${descText}</p>
                            <span class="text-xs font-bold text-amber-800 mt-1 inline-block">${item.price} AED</span>
                        </div>
                        <div class="flex items-center space-x-2 bg-stone-100 p-1 rounded-xl shrink-0">
                            <button onclick="updateQty('${item.id}', -1)" class="w-7 h-7 bg-white rounded-lg font-bold text-stone-700 shadow-xs">-</button>
                            <span id="qty-${item.id}" class="font-bold text-xs px-2">0</span>
                            <button onclick="updateQty('${item.id}', 1)" class="w-7 h-7 bg-stone-900 text-white rounded-lg font-bold shadow-xs">+</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateQty(id, change) {
            if (!cart[id]) cart[id] = 0;
            cart[id] = Math.max(0, cart[id] + change);
            if (cart[id] === 0) delete cart[id];
            
            const qtyEl = document.getElementById(`qty-${id}`);
            if (qtyEl) qtyEl.innerText = cart[id] || 0;
            updateCartUI();
        }

        function updateCartUI() {
            let totalCount = 0;
            let totalPrice = 0;

            for (const [id, qty] of Object.entries(cart)) {
                const item = menuItems.find(i => i.id == id);
                totalCount += qty;
                totalPrice += item.price * qty;
            }

            document.getElementById('cart-count').innerText = totalCount;
            document.getElementById('cart-total').innerText = totalPrice;

            const cartBar = document.getElementById('cart-bar');
            if (totalCount > 0) {
                cartBar.classList.remove('translate-y-full');
            } else {
                cartBar.classList.add('translate-y-full');
            }
        }

        async function sendOrderSupabaseAndWhatsApp() {
            const t = i18n[currentLang];
            if (!currentRoom) {
                alert(t.alertRoom);
                document.getElementById('input-room').focus();
                return;
            }

            let orderItems = [];
            let totalPrice = 0;

            for (const [id, qty] of Object.entries(cart)) {
                const item = menuItems.find(i => i.id == id);
                orderItems.push({ id: item.id, name: item.name.en, qty: qty, price: item.price });
                totalPrice += item.price * qty;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('orders')
                    .insert([
                        { room_number: currentRoom, language: currentLang, items: orderItems, total_amount: totalPrice }
                    ]);
                if (error) console.error("Erreur Supabase:", error);
            } catch (err) {
                console.error("Erreur de connexion Supabase:", err);
            }

            let message = `*NEW ROOM SERVICE ORDER*%0A`;
            message += `*Room / Villa:* ${currentRoom}%0A%0A`;
            message += `*Details:*%0A`;

            orderItems.forEach(i => {
                message += `- ${i.qty}x ${i.name} (${i.price * i.qty} AED)%0A`;
            });

            message += `%0A*Total Amount:* ${totalPrice} AED`;

            const phone = "971526966865";
            window.open(`https://wa.me/${phone}?text=${message}`, '_blank');
        }

        window.onload = initApp;
    </script>
