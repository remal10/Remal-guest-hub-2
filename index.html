<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espace Administration - Remal Hotel</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">
  <div class="max-w-4xl mx-auto">
    <!-- En-tête Admin -->
    <header class="flex justify-between items-center border-b border-slate-700 pb-4 mb-6">
      <div>
        <h1 class="text-2xl font-bold text-amber-400">Espace Réception & Administration</h1>
        <p class="text-slate-400 text-sm">Gestion des demandes clients en temps réel</p>
      </div>
      <span class="bg-green-500/10 text-green-400 border border-green-500/20 px-3 py-1 rounded-full text-xs font-semibold">
        ● Connecté
      </span>
    </header>

    <!-- Tableau / Liste des demandes -->
    <main>
      <h2 class="text-lg font-semibold mb-4">Demandes récentes :</h2>
      <div id="requests-list" class="space-y-4">
        <!-- Exemple de carte de demande -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex justify-between items-center">
          <div>
            <p class="font-bold text-amber-300">Chambre 104</p>
            <p class="text-slate-300 text-sm">Demande : Serviettes supplémentaires</p>
            <p class="text-slate-500 text-xs">Il y a 5 min</p>
          </div>
          <button class="bg-amber-500 text-slate-900 px-4 py-2 rounded-lg font-semibold text-sm hover:bg-amber-400">
            Marquer comme Traité
          </button>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
