<!DOCTYPE html>
<html lang="en" id="htmlRoot" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remal Hotel & Villas - Guest Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FAFAFA; color: #222222; }
        .font-serif-luxury { font-family: 'Playfair Display', serif; }
        .bg-remal-sand { background-color: #E2B383; }
        .text-remal-sand { color: #DCA773; }
        .remal-card { background: #FFFFFF; border: 1px solid #EAEAEA; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08); }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- HEADER CLIENT -->
    <header class="bg-white sticky top-0 z-50 border-b border-stone-200 shadow-sm">
        <div class="max-w-xl mx-auto px-5 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <img src="logo.png" alt="Remal Hotel & Villas" class="h-10 object-contain" onerror="this.style.display='none'; document.getElementById('textLogo').classList.remove('hidden');">
                <div id="textLogo" class="hidden">
                    <h1 class="text-sm font-serif-luxury text-stone-900 font-bold tracking-widest">REMAL</h1>
                    <p class="text-[8px] text-stone-500 uppercase tracking-wider">Hotel & Villas</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-3">
                <div class="flex bg-stone-100 p-1 rounded-full border border-stone-200 text-[11px] font-semibold">
                    <button onclick="setLang('en')" id="btn-lang-en" class="px-2.5 py-1 rounded-full bg-remal-sand text-white shadow-sm">EN</button>
                    <button onclick="setLang('ar')" id="btn-lang-ar" class="px-2.5 py-1 rounded-full text-stone-600">العربية</button>
                    <button onclick="setLang('hi')" id="btn-lang-hi" class="px-2.5 py-1 rounded-full text-stone-600">हिन्दी</button>
                </div>
            </div>
        </div>
    </header>

    <div class="max-w-xl mx-auto px-4 py-4 space-y-4">

        <!-- IDENTIFICATION CHAMBRE -->
        <div class="remal-card p-5 rounded-3xl flex justify-between items-center">
            <div>
                <p class="text-[10px] font-bold text-stone-400 uppercase tracking-wider" id="lblWelcome">Welcome to Remal</p>
                <h2 class="text-base font-serif-luxury font-bold text-stone-900" id="lblGuestName">Dear Valued Guest</h2>
            </div>
            <div class="flex items-center space-x-2 bg-stone-50 px-3 py-2 rounded-2xl border border-stone-200">
                <span class="text-xs font-bold text-stone-500" id="lblRoomLabel">Room:</span>
                <input type="text" id="clientRoomNum" placeholder="104" class="w-12 text-sm font-bold bg-transparent outline-none text-stone-900 text-center" onchange="sauvegarderChambreClient()">
            </div>
        </div>

        <!-- MENU SERVICES CLIENT -->
        <div class="grid grid-cols-2 gap-3">
            <button onclick="ouvrirService('Laundry Service')" class="remal-card p-5 rounded-3xl text-left hover:border-stone-400 transition space-y-2">
                <span class="text-2xl">🧺</span>
                <h3 class="font-serif-luxury font-bold text-stone-900 text-sm" id="lblLaundryTitle">Laundry & Pressing</h3>
                <p class="text-[10px] text-stone-500" id="lblLaundrySub">Express washing & care</p>
            </button>
            <button onclick="ouvrirService('Room Cleaning')" class="remal-card p-5 rounded-3xl text-left hover:border-stone-400 transition space-y-2">
                <span class="text-2xl">🧹</span>
                <h3 class="font-serif-luxury font-bold text-stone-900 text-sm" id="lblHousekeepingTitle">Housekeeping</h3>
                <p class="text-[10px] text-stone-500" id="lblHousekeepingSub">Room make-up & amenities</p>
            </button>
        </div>

        <!-- STATUT DES DEMANDES EN DIRECT (AVEC LES 4 STATUTS LAUNDRY) -->
        <div class="remal-card p-5 rounded-3xl space-y-3">
            <h3 class="text-xs font-serif-luxury font-bold text-stone-900 uppercase tracking-wider" id="lblActiveRequests">Your Active Requests</h3>
            <div id="clientRequestsList" class="space-y-2">
                <p class="text-xs text-stone-400 text-center py-2" id="lblNoActiveRequests">No active requests.</p>
            </div>
        </div>

    </div>

    <!-- MODAL DEMANDE DE SERVICE / LAUNDRY -->
    <div id="serviceModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl space-y-4 border border-stone-100 relative">
            <div class="flex justify-between items-center border-b border-stone-100 pb-3">
                <h3 id="modalServiceName" class="text-base font-serif-luxury font-bold text-stone-900">Service Request</h3>
                <button onclick="fermerModalService()" class="text-stone-400 text-xl font-bold">✕</button>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-stone-600 mb-1" id="lblModalNote">Special Notes / Garments Info</label>
                    <textarea id="clientServiceNote" rows="3" placeholder="Please specify your request or items..." class="w-full border border-stone-200 rounded-xl p-3 text-xs bg-stone-50 outline-none"></textarea>
                </div>

                <button onclick="envoyerDemandeService()" class="w-full bg-stone-900 hover:bg-stone-800 text-white font-bold py-3.5 rounded-xl text-xs shadow transition tracking-wider" id="btnSubmitRequest">Send Request</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://tbsroleffqhyzbbfmtvp.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRic3JvbGVmZnFoeXpiYmZtdHZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4MzUyMzMsImV4cCI6MjEwMDQxMTIzM30.oNKhoPJ7v__YJQW7flC9UsP2cIDHLMuxjqmf6_NvYW4';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentLang = 'en';
        let selectedServiceName = '';

        const i18n = {
            en: {
                lblWelcome: "Welcome to Remal", lblGuestName: "Dear Valued Guest", lblRoomLabel: "Room:",
                lblLaundryTitle: "Laundry & Pressing", lblLaundrySub: "Express washing & care",
                lblHousekeepingTitle: "Housekeeping", lblHousekeepingSub: "Room make-up & amenities",
                lblActiveRequests: "Your Active Requests", lblNoActiveRequests: "No active requests.",
                lblModalNote: "Special Notes / Garments Info", btnSubmitRequest: "Send Request"
            },
            ar: {
                lblWelcome: "مرحباً بكم في رمال", lblGuestName: "ضيفنا الكريم", lblRoomLabel: "الغرفة:",
                lblLaundryTitle: "المغسلة والكي", lblLaundrySub: "غسيل سريع وعناية بالملابس",
                lblHousekeepingTitle: "خدمة الغرف", lblHousekeepingSub: "تنظيف الغرفة واللوازم",
                lblActiveRequests: "طلباتك النشطة", lblNoActiveRequests: "لا توجد طلبات نشطة.",
                lblModalNote: "ملاحظات خاصة / معلومات الملابس", btnSubmitRequest: "إرسال الطلب"
            },
            hi: {
                lblWelcome: "रेमल में आपका स्वागत है", lblGuestName: "प्रिय अतिथि", lblRoomLabel: "कमरा:",
                lblLaundryTitle: "कपड़े धोने की सेवा", lblLaundrySub: "एक्सप्रेस धुलाई और देखभाल",
                lblHousekeepingTitle: "हाउसकीपिंग", lblHousekeepingSub: "कमरा सफाई और सुविधाएं",
                lblActiveRequests: "आपके सक्रिय अनुरोध", lblNoActiveRequests: "कोई सक्रिय अनुरोध नहीं है।",
                lblModalNote: "विशेष नोट्स / कपड़ों की जानकारी", btnSubmitRequest: "अनुरोध भेजें"
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const savedRoom = localStorage.getItem('remal_client_room');
            if (savedRoom) document.getElementById('clientRoomNum').value = savedRoom;
            chargerDemandesClient();
            setInterval(chargerDemandesClient, 5000);
        });

        function sauvegarderChambreClient() {
            const room = document.getElementById('clientRoomNum').value.trim();
            if (room) localStorage.setItem('remal_client_room', room);
            chargerDemandesClient();
        }

        function setLang(lang) {
            currentLang = lang;
            const t = i18n[lang] || i18n.en;
            document.getElementById('htmlRoot').setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
            
            ['en', 'ar', 'hi'].forEach(l => {
                const btn = document.getElementById(`btn-lang-${l}`);
                if (l === lang) btn.className = "px-2.5 py-1 rounded-full bg-remal-sand text-white shadow-sm font-bold";
                else btn.className = "px-2.5 py-1 rounded-full text-stone-600";
            });

            document.getElementById('lblWelcome').innerText = t.lblWelcome;
            document.getElementById('lblGuestName').innerText = t.lblGuestName;
            document.getElementById('lblRoomLabel').innerText = t.lblRoomLabel;
            document.getElementById('lblLaundryTitle').innerText = t.lblLaundryTitle;
            document.getElementById('lblLaundrySub').innerText = t.lblLaundrySub;
            document.getElementById('lblHousekeepingTitle').innerText = t.lblHousekeepingTitle;
            document.getElementById('lblHousekeepingSub').innerText = t.lblHousekeepingSub;
            document.getElementById('lblActiveRequests').innerText = t.lblActiveRequests;
            document.getElementById('lblNoActiveRequests').innerText = t.lblNoActiveRequests;
            document.getElementById('lblModalNote').innerText = t.lblModalNote;
            document.getElementById('btnSubmitRequest').innerText = t.btnSubmitRequest;
        }

        function ouvrirService(serviceName) {
            selectedServiceName = serviceName;
            document.getElementById('modalServiceName').innerText = serviceName;
            document.getElementById('clientServiceNote').value = '';
            document.getElementById('serviceModal').classList.remove('hidden');
        }

        function fermerModalService() {
            document.getElementById('serviceModal').classList.add('hidden');
        }

        async function envoyerDemandeService() {
            const room = document.getElementById('clientRoomNum').value.trim();
            const note = document.getElementById('clientServiceNote').value.trim();

            if (!room) {
                alert('Please enter your room number first.');
                return;
            }

            const payload = {
                room: room,
                service: selectedServiceName,
                notes: note || 'Standard request',
                status: 'Pending'
            };

            const { error } = await supabaseClient.from('requests').insert([payload]);
            if (error) {
                alert('Error sending request. Please try again.');
            } else {
                alert('Your request has been sent successfully!');
                fermerModalService();
                chargerDemandesClient();
            }
        }

        async function chargerDemandesClient() {
            const room = document.getElementById('clientRoomNum').value.trim();
            const container = document.getElementById('clientRequestsList');
            
            if (!room) {
                container.innerHTML = `<p class="text-xs text-stone-400 text-center py-2">Please enter your room number above.</p>`;
                return;
            }

            const { data } = await supabaseClient
                .from('requests')
                .select('*')
                .eq('room', room);

            if (!data || data.length === 0) {
                container.innerHTML = `<p class="text-xs text-stone-400 text-center py-2">No active requests.</p>`;
                return;
            }

            container.innerHTML = '';
            data.forEach(req => {
                const status = req.status || 'Pending';
                let statusBg = 'bg-amber-100 text-amber-800';
                if (status === 'Collected') statusBg = 'bg-stone-200 text-stone-800';
                if (status === 'Washing') statusBg = 'bg-blue-100 text-blue-800';
                if (status === 'Ready') statusBg = 'bg-purple-100 text-purple-800';
                if (status === 'Delivered') statusBg = 'bg-emerald-100 text-emerald-800';

                const div = document.createElement('div');
                div.className = 'p-3 bg-stone-50 rounded-2xl border border-stone-200 text-xs flex justify-between items-center';
                div.innerHTML = `
                    <div>
                        <p class="font-bold text-stone-900">${req.service}</p>
                        <p class="text-[10px] text-stone-500 italic mt-0.5">"${req.notes || ''}"</p>
                    </div>
                    <span class="font-bold px-2.5 py-1 rounded-full text-[10px] ${statusBg}">${status}</span>
                `;
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
